services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: remind
      POSTGRES_PASSWORD: remind
      POSTGRES_DB: remind
    ports:
      - "5432:5432"
    volumes:
      - remind_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  remind_pg_data:
